<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Dressedbyvochandgoch</title>
    <style>
        /* Basic Page Styles */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }

        /* Main Login Box */
        .login-container {
            background-color: #ffffff;
            padding: 2.5rem;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            color: #333;
        }

        /* Tab Buttons */
        .tab-buttons {
            display: flex;
            margin-bottom: 1.5rem;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid #ccc;
        }

        .tab-link {
            flex: 1; /* Each button takes 50% width */
            padding: 0.8rem;
            background: #f9f9f9;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            color: #555;
            transition: background 0.2s, color 0.2s;
        }

        .tab-link:not(.active):hover {
            background: #e9e9e9;
        }

        .tab-link.active {
            background-color: #d15a7f; /* Using the brand pink from profile icon */
            color: white;
            border-color: #d15a7f;
        }

        /* Forms */
        .login-form {
            display: none; /* Hide forms by default */
        }

        .login-form.active-form {
            display: block; /* Show only the active form */
        }

        .form-group {
            margin-bottom: 1rem;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* Ensures padding doesn't affect width */
            font-size: 1rem;
        }

        /* Submit Button */
        .submit-button {
            width: 100%;
            padding: 12px;
            background: #555;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: background 0.2s;
        }

        .submit-button:hover {
            background: #333;
        }

        /* Helper Links */
        .form-links {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        .form-links a {
            color: #d15a7f;
            text-decoration: none;
        }

        .form-links a:hover {
            text-decoration: underline;
        }

        /* "Back to Home" Link */
        .back-to-home {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #555;
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <a href="index.html" class="back-to-home">&larr; Back to Home</a>

    <div class="login-container">
        
        <div class="tab-buttons">
            <button class="tab-link active" data-target="client">Client</button>
            <button class="tab-link" data-target="admin">Admin</button>
        </div>

        <form id="client" class="login-form active-form">
            <h2>Client Login</h2>
            <div class="form-group">
                <label for="client-email">Email</label>
                <input type="email" id="client-email" required>
            </div>
            <div class="form-group">
                <label for="client-password">Password</label>
                <input type="password" id="client-password" required>
            </div>
            <button type="submit" class="submit-button">Login</button>
            <p class="form-links">
                <a href="#">Forgot Password?</a> | <a href="index.html">Create Account</a>
            </p>
        </form>

        <form id="admin" class="login-form">
            <h2>Admin Login</h2>
            <div class="form-group">
                <label for="admin-username">Username or Email</label>
                <input type="text" id="admin-username" required>
            </div>
            <div class="form-group">
                <label for="admin-password">Password</label>
                <input type="password" id="admin-password" required>
            </div>
            <button type="submit" class="submit-button">Login</button>
        </form>

    </div>

    <script>
        // JavaScript for Tab Switching
        const tabLinks = document.querySelectorAll('.tab-link');
        const forms = document.querySelectorAll('.login-form');

        tabLinks.forEach(link => {
            link.addEventListener('click', () => {
                const targetId = link.getAttribute('data-target');

                // Update Tab Button styles
                tabLinks.forEach(btn => btn.classList.remove('active'));
                link.classList.add('active');

                // Show/Hide Forms
                forms.forEach(form => {
                    if (form.id === targetId) {
                        form.classList.add('active-form');
                    } else {
                        form.classList.remove('active-form');
                    }
                });
            });
        });
    </script>

</body>
</html>
